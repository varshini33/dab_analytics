# This is a Declarative Automation Bundle definition for bakehouse_analytics.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: bakehouse_analytics
  uuid: c811daf1-ed4e-4096-a758-908805efd3b7

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development # puts a prefix or suffix dev for the jobs and the person's email to know who deployed
    default: true
    workspace:
      host: https://dbc-52a25fcb-a80b.cloud.databricks.com
    variables:
      catalog: bakehouse_analytics_dev
      schema: rnd
  prod:
    mode: production # no prefix or suffix is mode is prod
    workspace:
      host: https://dbc-52a25fcb-a80b.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/hamsaavarshinib11@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/hamsaavarshinib11@gmail.com/.bundle/${bundle.name}/${bundle.target} # path where artifacts are deployed
    variables:
      catalog: bakehouse_analytics_dev
      schema: rnd
    permissions:
      - user_name: hamsaavarshinib11@gmail.com
        level: CAN_MANAGE
